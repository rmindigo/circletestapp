version: 2.1

orbs:
  node: circleci/node@7.2.1

parameters:
  run-api:
    type: boolean
    default: false
  run-web:
    type: boolean
    default: false
  run-e2e:
    type: boolean
    default: false
  run-all:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:22.23.5
    resource_class: medium

commands:
  install:
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm

jobs:
  test:
    parameters:
      workspace:
        type: string
      parallelism:
        type: integer
        default: 1
    executor: node
    parallelism: << parameters.parallelism >>
    steps:
      - install
      - run:
          name: Typecheck
          command: npm run typecheck -w << parameters.workspace >>
      - run:
          name: Run tests (split by timing across containers)
          working_directory: << parameters.workspace >>
          command: |
            circleci tests glob "test/**/*.test.ts" "src/**/*.test.ts*" \
              | circleci tests run --command="xargs npx vitest run" --split-by=timings
      - store_test_results:
          path: << parameters.workspace >>/reports

  build-web:
    executor: node
    steps:
      - install
      - run: npm run build -w apps/web
      - store_artifacts:
          path: apps/web/dist
          destination: web-dist

  build-api-image:
    parameters:
      push:
        type: boolean
        default: false
    executor: node
    environment:
      IMAGE: ghcr.io/rmindigo/circletestapp-api
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build image
          command: |
            docker build -f services/api/Dockerfile \
              --build-arg APP_VERSION=${CIRCLE_SHA1:0:7} \
              -t $IMAGE:${CIRCLE_SHA1:0:7} .
      - run:
          name: Smoke test container
          command: |
            docker run -d --name api $IMAGE:${CIRCLE_SHA1:0:7}
            sleep 3
            docker exec api wget -qO- localhost:3000/health
      - when:
          condition: << parameters.push >>
          steps:
            - run:
                name: Push to GHCR
                command: |
                  echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                  docker push $IMAGE:${CIRCLE_SHA1:0:7}

  e2e:
    executor: node
    parallelism: 2
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /home/circleci/.cache/ms-playwright
    steps:
      - install
      - run:
          name: Record Playwright version for cache key
          command: npx -w e2e playwright --version > /tmp/playwright-version
      - restore_cache:
          keys:
            - playwright-v1-{{ arch }}-{{ checksum "/tmp/playwright-version" }}
      - run:
          name: Install Chromium and its system dependencies
          command: npx -w e2e playwright install --with-deps chromium
      - save_cache:
          key: playwright-v1-{{ arch }}-{{ checksum "/tmp/playwright-version" }}
          paths:
            - /home/circleci/.cache/ms-playwright
      - run:
          name: Run E2E tests (split by timing across containers)
          working_directory: e2e
          command: |
            circleci tests glob "*.spec.ts" \
              | circleci tests run --command="xargs npx playwright test" --split-by=timings --timings-type=classname
      - store_test_results:
          path: e2e/reports/junit.xml
      - store_artifacts:
          path: e2e/reports/html
          destination: playwright-report
      - store_artifacts:
          path: e2e/reports/artifacts
          destination: failure-artifacts

  deploy:
    parameters:
      environment:
        type: string
    executor: node
    resource_class: small
    environment:
      RELEASE: api-<< parameters.environment >>
    steps:
      - run:
          name: Plan release (deploy marker)
          command: |
            circleci run release plan "$RELEASE" \
              --environment-name=<< parameters.environment >> \
              --component-name=api \
              --target-version=${CIRCLE_SHA1:0:7}
      - run:
          name: Deploy to << parameters.environment >>
          command: |
            circleci run release update "$RELEASE" --status=running
            # Replace with a real deploy (kubectl, helm, ECS, etc.). Credentials
            # come from the CircleCI context attached to this job, never the repo.
            echo "Deploying ghcr.io/rmindigo/circletestapp-api:${CIRCLE_SHA1:0:7} to << parameters.environment >>"
            echo "DEPLOY_TARGET=${DEPLOY_TARGET:-<set in context>}"
      - run:
          name: Mark release succeeded
          command: circleci run release update "$RELEASE" --status=SUCCESS
          when: on_success
      - run:
          name: Mark release failed
          command: circleci run release update "$RELEASE" --status=FAILED
          when: on_fail

  # Watches monitoring after the production deploy. If Alertmanager sends a
  # firing error_rate alert for component api / env production within the
  # window, the release fails and CircleCI runs the rollback pipeline.
  validate-production:
    type: release
    plan_name: api-production
    validation:
      enabled: true
      evaluation_time: 10m
      auto_rollback_on_failure: true
      webhooks:
        - name: error_rate
          provider: prometheus
          fail_when: 'criteria == "firing"'
          max_failures: 1

workflows:
  api:
    when:
      or: [<< pipeline.parameters.run-api >>, << pipeline.parameters.run-all >>]
    jobs:
      - test:
          name: api-test
          workspace: services/api
          parallelism: 2
      - build-api-image:
          name: api-image
          requires: [api-test]
          filters:
            branches:
              ignore: main
      - build-api-image:
          name: api-image-publish
          push: true
          context: ghcr-publish
          requires: [api-test]
          filters:
            branches:
              only: main
      - deploy:
          name: deploy-staging
          environment: staging
          context: staging
          requires: [api-image-publish]
      - hold-production:
          type: approval
          requires: [deploy-staging]
      - deploy:
          name: deploy-production
          environment: production
          context: production
          requires: [hold-production]
      - validate-production:
          requires: [deploy-production]

  e2e:
    when:
      or:
        - << pipeline.parameters.run-api >>
        - << pipeline.parameters.run-web >>
        - << pipeline.parameters.run-e2e >>
        - << pipeline.parameters.run-all >>
    jobs:
      - e2e

  web:
    when:
      or: [<< pipeline.parameters.run-web >>, << pipeline.parameters.run-all >>]
    jobs:
      - test:
          name: web-test
          workspace: apps/web
      - build-web:
          requires: [web-test]
